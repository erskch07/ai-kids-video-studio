name: 🚀 High-Performance Build Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ⚡ Fast Build & Cache
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # OPTIONAL: Set if your code lives in a subfolder (e.g., 'frontend' or 'studio')
    # defaults:
    #   run:
    #     working-directory: ./studio

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # Uncomment and update if package-lock is inside a folder:
          # cache-dependency-path: 'studio/package-lock.json'

      - name: 📦 Cache Vite Artifacts
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .cache
          key: ${{ runner.os }}-vite-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🛠️ Build (Typecheck & Bundle)
        run: |
          npx tsc --noEmit
          npm run build

      - name: 📤 Archive Dist Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          compression-level: 9
          if-no-files-found: error
